# Earth-toned stacked cards. Each opens to a short summary and a link.
themes:
  title: One connected research program
  items:
    - name: multi-omics of stress
      tone: forest
      text: Metabolomics, volatilomics, ionomics, transcriptomics, genomics and phenomics measured on the same plants and read together.
      link: /research/#rt-omics
    - name: thresholds and networks
      tone: coffee
      text: Defining when plants shift from acclimation to a stress-response mode, using network inference and machine learning.
      link: /research/#rt-thresholds
    - name: rootstock resilience
      tone: red
      text: How root system architecture, ion selectivity and root-shoot signalling shape scion performance and yield stability.
      link: /research/#rt-rootstock
    - name: combined stress in grapevine
      tone: ochre
      text: Grafted Vitis vinifera under combined salinity, water deficit and heat, linked to phenology and agronomic performance.
      link: /research/#rt-combined
    - name: crop improvement by breeding
      tone: sage
      text: Sorghum breeding for dryland Ethiopia, multi-environment trials, and earlier work on maize, wheat, barley and haricot bean.
      link: /research/#rt-breeding
    - name: climate-informed prediction
      tone: teal
      text: Multi-year phenotyping, UAV thermal sensing and climate data combined to predict varietal performance under heatwaves.
      link: /research/#rt-climate

